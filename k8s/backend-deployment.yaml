apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: forever
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: kiran22sktech/forever-backend
          imagePullPolicy: Always
          ports:
            - containerPort: 4000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"


          readinessProbe:
              httpGet:
                path: /metrics
                port: 4000
              initialDelaySeconds: 10
              periodSeconds: 10

          livenessProbe:
              httpGet:
                path: /metrics
                port: 4000
              initialDelaySeconds: 30
              periodSeconds: 15

          envFrom:
            - configMapRef:
                name: forever-config
            - secretRef:
                name: forever-secret