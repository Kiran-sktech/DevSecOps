
services:

  backend:
    build: ./backend
    container_name: forever-backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_URL: http://localhost:4000
    container_name: forever-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped


  admin:
    build:
      context: ./admin
      args:
        VITE_BACKEND_URL: http://localhost:4000
    container_name: forever-admin
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped